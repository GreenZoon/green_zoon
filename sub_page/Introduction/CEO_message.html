    <main>

        <section class="company_greeting">

            <div class="company_greeting_text">

                <h1>대표 인사말</h1>

                <h2>안녕하십니까. (주)그린죤의 김세진입니다.</h2>

                <p>
                    저희 그린죤은 사람, 친환경, 고객을 소중한 가치로 여기는 기업입니다.
                    지속적인 기술발전에 비해 환경은 점점 망가지고 있는 현재 상황 속에서
                    우리 후손이 살아갈 지구환경을 위해 진정한 엔지니어링의 역할을 되새겨보고 있습니다.
                    끊임없는 기술개발로 빠르게 변화하는 크리닝산업 속에서도 환경을 생각하며
                    인정받는 전문기업이 되도록 노력하겠습니다.
                    앞으로도 고객 여러분의 많은 관심과 성원 보내주시길 바랍니다.
                </p>

            </div>

            <!-- 대표 이미지 교체 영역 -->
