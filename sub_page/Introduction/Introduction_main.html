            <div class="company_intro_text">

                <h1>기업소개</h1>

                <p>
                    그린죤은 기술력으로 늘 도전하고 경쟁하는 기업입니다.
                    오랜 현장 경험의 노하우를 바탕으로 한 청소, 방역, 건물관리 등
                    각 분야 전문인력으로 구성되어 있으며, 주기적인 맞춤 교육을 통해
                    인력을 양성하고 있습니다. 진정으로 삶의 질을 높여 인류공영의 목표를
                    실현하기 위한 경영기반을 구축하며 미래지향적 가치를 창출함으로써
                    풍요로운 21세기를 이끄는 개척자가 되겠습니다.
                </p>
