<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그린죤 - 이용후기 작성</title>
    <link rel="stylesheet" href="../../css/reseat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../../css/coom.css">
    <link rel="stylesheet" href="../../css/header_stayl.css">
    <link rel="stylesheet" href="../../css/menu.css">
    <link rel="stylesheet" href="../../css/footer.css">
    <link rel="stylesheet" href="../../css/gallery_community.css">
</head>
<body class="community_page" data-community-page="reviews">
    <div id="header"></div><div id="menu"></div><div class="sub_visual" role="img" aria-label="커뮤니티 대표 이미지"></div>
    <nav id="Community_sub_menu" class="subpage_nav" aria-label="커뮤니티 서브메뉴"></nav>
    <nav class="breadcrumb" aria-label="현재 페이지 경로"><span class="home"></span><a href="../../index.html">홈</a><span class="arrow left_arrow_2"></span><p>커뮤니티</p><span class="arrow left_arrow_2"></span><a href="Reviews.html">이용후기</a><span class="arrow left_arrow_2"></span><p aria-current="page">작성하기</p></nav>
    <main class="community">
        <div class="sub_content community_body">
            <h1>이용 후기 작성</h1>
            <form class="review_form" data-review-form>
                <input type="hidden" name="author">

                <label class="review_field">
                    <span class="review_label">제목</span>
                    <span class="review_hint"><span class="icon info review_hint_icon" aria-hidden="true"></span>후기 제목을 입력해 주세요.</span>
                    <input class="review_control" type="text" name="title" placeholder="제목을 작성해주세요" required>
                </label>

                <label class="review_field">
                    <span class="review_label">내용</span>
                    <span class="review_hint"><span class="icon info review_hint_icon" aria-hidden="true"></span>이용하신 서비스와 작업 결과를 자세히 작성해 주세요.</span>
                    <textarea class="review_control review_textarea" name="content" placeholder="후기 내용을 작성해주세요" required></textarea>
                </label>

                <div class="review_field">
                    <span class="review_label">이미지 첨부</span>
                    <span class="review_hint"><span class="icon info review_hint_icon" aria-hidden="true"></span>후기와 관련된 이미지를 첨부해 주세요.</span>
                    <label class="review_upload" data-review-upload>
                        <span class="icon picture review_upload_icon" aria-hidden="true"></span>
                        <span>첨부할 이미지를 끌어다 놓거나 클릭 후 직접 선택해 주세요</span>
                        <input type="file" name="images" accept="image/*" multiple data-review-images>
                    </label>
                </div>

                <p class="review_form_message" data-review-message aria-live="polite"></p>

                <div class="review_form_actions">
                    <button type="button" class="review_draft" data-review-draft>후기 임시 저장하기</button>
                    <button type="submit">후기 작성완료하기</button>
                </div>
            </form>
        </div>
    </main>
    <div id="footer"></div>
    <script src="../../js/jquery-3.7.1.min.js"></script><script src="../../js/mobile_menu.js"></script><script src="../../js/sub_common.js"></script><script src="../../js/post_detail.js"></script>
</body>
</html>
