<header class="header">

    <!-- 로고 부분 -->
  

    <div class="header_top">

        <a class="header_logo" href="/index.html" aria-label="그린죤 홈">
            <span class="logo" aria-hidden="true"></span>
        </a>
        
        <!-- 로고 부분 끝 -->

        <!--  검색창 -->

            <form class="search_form" id="header_search" action="/index.html" method="get">
                
                <fieldset>

                    <div class="search_area">

                        <div class="search_tap">

                            <label class="search_title" for="search_input">
                                검색
                            </label>

                            <button class="search_close_btn" type="button" aria-label="검색창 닫기">

                                <span class="cancel search_cancel" aria-hidden="true"></span>

                            </button>
                            
                        </div>

                        <div class="search_wrap">

                            <input autocomplete="on" class="search_input" type="search" id="search_input" name="query" placeholder="검색어를 입력하세요">

                            <button class="search_but" type="submit" aria-label="검색">
                                
                                <span class="icon search_ion" aria-hidden="true"></span>
                        
                            </button>

                        </div>
                
                    </div>

                                <!-- 검색어 목록 영역 -->
                    <div class="search_keyword_area">

                        <div class="search_inner">

                            <section class="keyword_section">

                                <h3 class="keyword_title">
                                    최신 검색어
                                </h3>

                                <ul class="keyword_list">
                                    <li>
                                        <button type="button" class="keyword_button">
                                            <span class="search_ion keyword_icon" aria-hidden="true"></span>
                                            물탱크 청소
                                        </button>
                                    </li>

                                    <li>
                                        <button type="button" class="keyword_button">
                                            <span class="search_ion keyword_icon" aria-hidden="true"></span>
                                            위생관리
                                        </button>
                                    </li>

                                    <li>
                                        <button type="button" class="keyword_button">
                                            <span class="search_ion keyword_icon" aria-hidden="true"></span>
                                            외벽청소
                                        </button>
                                    </li>

                                    <li>
                                        <button type="button" class="keyword_button">
                                            <span class="search_ion keyword_icon" aria-hidden="true"></span>
                                            저수조 청소
                                        </button>
                                    </li>
                                </ul>

                            </section>

                            <section class="keyword_section">

                                <h3 class="keyword_title">
                                    추천 검색어
                                </h3>

                                <ul class="keyword_list">
                                    <li>
                                        <button type="button" class="keyword_button">
                                            <span class="search_ion keyword_icon" aria-hidden="true"></span>
                                            물탱크 청소
                                        </button>
                                    </li>

                                    <li>
                                        <button type="button" class="keyword_button">
                                            <span class="search_ion keyword_icon" aria-hidden="true"></span>
                                            외벽 방수
                                        </button>
                                    </li>

                                    <li>
                                        <button type="button" class="keyword_button">
                                            <span class="search_ion keyword_icon" aria-hidden="true"></span>
                                            유리창 청소
                                        </button>
                                    </li>
                                </ul>

                            </section>

                        </div>

                    </div>

                </fieldset>
            </form>

        <!--  검색창 끝 -->

        <!--  로그인 메뉴 -->

        <ul class="login_menu">

            <li>

                <button class="login_li search_open_btn" type="button" aria-controls="header_search" aria-expanded="false" >
                   
                    <span class="icon search_ion"></span>
                   
                    <p>검색</p>

                </button>

            </li>

            <li>
                
                <a class="login_li" data-auth-link href="/user_page/Login.html" aria-label="로그인">

                    <span class="icon login" data-auth-icon aria-hidden="true"></span>
    
                    <p data-auth-label>로그인</p>
                    
                </a>

            </li>
                

        </ul>

            <!--로그인끝 -->

     <div class="mobile_header_menu">

    <button
        class="mobile_header_btn search_open_btn"
        type="button"
        aria-controls="header_search"
        aria-expanded="false"
        aria-label="검색"
    >
        <span class="icon search_ion" aria-hidden="true"></span>
    </button>

    <a
        href="/user_page/Login.html"
        class="mobile_header_btn"
        data-auth-link
        aria-label="로그인"
    >
        <span class="icon login" data-auth-icon aria-hidden="true"></span>
    </a>

    <button
        class="mobile_header_btn mobile_menu_open_btn"
        type="button"
        aria-controls="mobile_menu"
        aria-expanded="false"
        aria-label="전체 메뉴 열기"
    >
        <span class="hamburger_icon" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </span>
    </button>

</div>

    </div>

</header>  

    <!-- 메인 메뉴 시작 -->
