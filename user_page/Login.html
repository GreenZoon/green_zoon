<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)그린죤 - 로그인</title>
    <link rel="stylesheet" href="../css/reseat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../css/coom.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login_page account_page">
  
    <main class="account_login">
     
        <a class="account_login_logo icon logo" href="../index.html" aria-label="그린죤 메인으로 이동"></a>

        <section class="account_login_panel" aria-labelledby="login_title">
         
            <h1 id="login_title" class="blind">로그인</h1>

            <form id="login_form" class="account_login_form" novalidate>
         
                <label class="account_field">
          
                    <span>아이디를 입력해주세요</span>

                    <input type="email" id="login_email" name="email" autocomplete="username" placeholder="Green@green.com" required>
                    <small class="login_error" data-error-for="email"></small>
                
                </label>

                <label class="account_field account_password_field">
                   
                    <span>비밀번호를 입력해 주세요</span>
                    
                    <span class="account_password_input">
                        
                        <input type="password" id="login_password" name="password" autocomplete="current-password" placeholder="비밀번호" minlength="4" required>
                       
                        <button type="button" class="password_toggle" data-password-toggle aria-label="비밀번호 표시">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Zm9.5 3.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/></svg>
                        
                        </button>
                    
                    </span>
                   
                    <small class="login_error" data-error-for="password"></small>
                
                </label>

                <div class="account_login_options">
                  
                    <label class="remember_login"><input type="checkbox" name="remember"><span>로그인 상태 유지</span></label>
                    <button type="button" class="login_text_action" data-login-help>아이디·비밀번호 찾기</button>
              
                </div>

                <div id="login_help" class="login_inline_notice" hidden>가입 정보 확인은 대표번호 <a href="tel:18991367">1899-1367</a>로 문의해 주세요.</div>
                <div id="login_message" class="login_message" role="alert" aria-live="polite"></div>

                <div class="account_login_buttons">
                
                    <button type="button" class="account_signup_button" data-signup>회원가입</button>
                    <button type="submit" class="account_submit">로그인</button>
                    <button type="button" class="account_guest" data-guest>비회원로그인</button>
              
                </div>
         
            </form>

            <div class="account_divider"><span>소셜 로그인</span></div>
            <div class="account_social" aria-label="간편 로그인">
           
                <button type="button" class="social_naver" data-social-login="naver" aria-label="네이버 로그인">N</button>
                <button type="button" class="social_google" data-social-login="google" aria-label="구글 로그인">G</button>
                <button type="button" class="social_facebook" data-social-login="facebook" aria-label="페이스북 로그인">f</button>
           
            </div>
          
            <p class="account_signup">신규 회원이신가요? <button type="button" data-signup>회원가입</button></p>
            <div id="signup_notice" class="login_signup_notice" hidden>온라인 회원가입 준비 중입니다. 계정 등록이 필요한 경우 대표번호로 문의해 주세요.</div>
      
        </section>
  
    </main>

    <div id="login_toast" class="login_toast" role="status" aria-live="polite"></div>
    <script src="../js/mobile_menu.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
