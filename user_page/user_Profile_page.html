<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)그린죤 - 내 정보</title>
    <link rel="stylesheet" href="../css/reseat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../css/coom.css">
    <link rel="stylesheet" href="../css/header_stayl.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login_page profile_page is_auth_checking">
    <div id="header"></div>
    <div id="menu"></div>

    <main class="login_main profile_main">
        <nav class="login_breadcrumb" aria-label="현재 위치">
            <a href="../index.html">홈</a>
            <span class="icon arrow right_arrow_2 login_breadcrumb_arrow" aria-hidden="true"></span>
            <span aria-current="page">내 정보</span>
        </nav>

        <section class="profile_panel" aria-labelledby="profile_title">
            <div class="profile_heading">
                <span class="profile_avatar"><span class="icon user" aria-hidden="true"></span></span>
                <div>
                    <span>GREEN ZONE ACCOUNT</span>
                    <h1 id="profile_title">내 정보</h1>
                    <p>로그인 계정과 온라인 신청 메뉴를 확인할 수 있습니다.</p>
                </div>
            </div>

            <button type="button" id="profile_edit" class="profile_edit" hidden>프로필 편집</button>

            <form id="profile_form" class="profile_form">
                <label><p>홈페이지 닉네임</p><input id="profile_name" name="name" type="text" placeholder="홈페이지 닉네임을 입력해 주세요" readonly></label>
                <label><p>등급</p><input id="profile_grade" name="grade" type="text" value="일반회원" readonly></label>
                <label><p>업체/상호/관공서명</p><input name="company" type="text" placeholder="업체 또는 기관명을 입력해 주세요" readonly></label>
                <label><p>담당자명</p><input name="manager" type="text" placeholder="담당자명을 입력해 주세요" readonly></label>
                <label><p>연락처</p><input name="phone" type="tel" placeholder="전화번호를 입력해 주세요 (예시: 010-0000-0000)" readonly></label>
                <label><p>청소작업 구역 주소</p><textarea name="address" placeholder="청소작업 구역 주소를 입력해 주세요" readonly></textarea></label>
                <p class="profile_email">로그인 아이디 <strong id="profile_email">-</strong></p>
            </form>

            <div class="profile_actions">
                <a class="login_primary_button profile_action_link" href="Online_application.html">온라인 작업 신청</a>
                <button type="button" id="profile_logout" class="login_secondary_button">로그아웃</button>
            </div>
        </section>

    </main>

    <!-- 피그마 1658:50142 관리자 프로필 편집 팝업 -->
    <dialog id="profile_editor" class="profile_editor" aria-labelledby="profile_editor_title">
        <form id="profile_edit_form" class="profile_edit_form" method="dialog">
            <header class="profile_editor_head">
                <div>
                    <h1 id="profile_editor_title">프로필 정보 편집</h1>
                    <p>관리자 계정 정보를 수정할 수 있습니다.</p>
                </div>
                <button type="button" class="profile_close" data-profile-back aria-label="프로필 편집 닫기">×</button>
            </header>

            <div class="profile_fields">
                <label class="profile_field">
                    <p>홈페이지 닉네임</p>
                    <input name="name" type="text" placeholder="홈페이지 닉네임을 입력해 주세요">
                </label>

                <label class="profile_field">
                    <p>등급</p>
                    <span class="profile_grade_select">
                        <select name="grade" aria-label="회원 등급">
                            <option value="일반회원">일반회원</option>
                            <option value="관리자">관리자</option>
                        </select>
                        <span class="icon date_select_arrow" aria-hidden="true"></span>
                    </span>
                </label>

                <label class="profile_field">
                    <p>업체/상호/관공서명</p>
                    <input name="company" type="text" placeholder="업체 또는 기관명을 입력해 주세요">
                </label>

                <label class="profile_field">
                    <p>담당자명</p>
                    <input name="manager" type="text" placeholder="담당자명을 입력해 주세요">
                </label>

                <label class="profile_field">
                    <p>연락처</p>
                    <input name="phone" type="tel" placeholder="전화번호를 입력해 주세요 (예시: 010-0000-0000)">
                </label>

                <label class="profile_field">
                    <p>청소작업 구역 주소</p>
                    <textarea name="address" placeholder="청소작업 구역 주소를 입력해 주세요"></textarea>
                </label>
            </div>

            <div class="profile_submit">
                <button type="button" class="login_secondary_button" data-profile-back>취소</button>
                <button type="submit" class="login_primary_button">프로필 저장</button>
            </div>
        </form>
    </dialog>

    <div id="footer"></div>
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/mobile_menu.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/user_Profile_page.js"></script>
</body>
</html>
